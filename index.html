<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบรับฝากและดาวน์โหลดไฟล์ผ่าน LINE OA</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('drive_theme_mode') || 'SYSTEM';
          var sysDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'DARK' || (mode === 'SYSTEM' && sysDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFD] dark:bg-[#1B1B1B] text-[#1F1F1F] dark:text-[#E3E3E3] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
